<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Il Mio Account — Falianz Theory</title>
  <style>
    .account-container {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
    }

    .account-section {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .account-section h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
      color: #333;
    }

    .form-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-field {
      display: flex;
      flex-direction: column;
    }

    .form-field label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .form-field input {
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: #f9f9f9;
      color: #333;
      transition: border-color 0.2s;
    }

    .form-field input:focus {
      outline: none;
      border-color: #ff6b6b;
      background: #fff;
    }

    .form-field input:disabled {
      background: #f0f0f0;
      color: #999;
      cursor: not-allowed;
    }

    .account-alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 500;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .subscription-status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .subscription-status.expired {
      background: #ffebee;
      color: #c62828;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .btn--primary {
      background: #ff6b6b;
      color: #fff;
    }

    .btn--primary:hover {
      background: #ff5252;
      transform: translateY(-2px);
    }

    .btn--outline {
      background: transparent;
      color: #ff6b6b;
      border: 2px solid #ff6b6b;
    }

    .btn--outline:hover {
      background: #fff5f5;
    }

    .account-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .info-card {
      background: #f9f9f9;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #ff6b6b;
    }

    .info-card-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .info-card-value {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    @media (max-width: 768px) {
      .form-group {
        grid-template-columns: 1fr;
      }

      .account-container {
        margin: 40px auto;
        padding: 15px;
      }

      .account-section {
        padding: 20px;
      }

      .form-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
